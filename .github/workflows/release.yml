# Publishes automatically on every push to main that changes the package:
#   1. next-version (jobcelis-team/.github) picks the version: the last release
#      plus a patch, or the version in VERSION when it was raised by hand.
#      Docs, tests, CI and repo config release nothing.
#   2. writes it into VERSION and commits it locally
#   3. builds it; the tag is the release (SwiftPM)
#   4. pushes the version commit and tags X.Y.Z
# To release a minor or major version, raise it in VERSION.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Builds on macOS before tagging; ci.yml also checks Linux on every pull request
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: current
        run: |
          VERSION=$(tr -d "[:space:]" < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Next version
        id: v
        uses: jobcelis-team/.github/actions/next-version@main
        with:
          current: ${{ steps.current.outputs.version }}
          tag-prefix: ""

      - name: Write the version
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          echo "$VERSION" > VERSION

      - name: Commit the version
        if: steps.v.outputs.release == 'true'
        uses: jobcelis-team/.github/actions/commit-version@main
        with:
          version: ${{ steps.v.outputs.version }}

      - name: Build
        if: steps.v.outputs.release == 'true'
        run: swift build

      - name: Push the version and tag the release
        if: steps.v.outputs.release == 'true'
        uses: jobcelis-team/.github/actions/push-release@main
        with:
          tag: ${{ steps.v.outputs.tag }}
