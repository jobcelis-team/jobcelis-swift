# Builds and checks every pull request (Dependabot's too) the same way Release
# does before publishing, so a change that would break the release fails here.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and test
        run: swift build && swift test

  # Server-side Swift (Vapor, Hummingbird): CryptoKit comes from swift-crypto here
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7

      - name: Build and test
        run: swift build && swift test
