# Builds and checks every pull request (Dependabot's too) the same way Release
# does before publishing, so a change that would break the release fails here.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # macOS: the package targets Apple platforms and uses CryptoKit (not on Linux)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build
